# =========================================================
# LungInsight AI — Central Configuration
# All hyperparameters and paths are controlled from here.
# =========================================================

project:
  name: "LungInsight-AI"
  seed: 42
  device: "cuda"          # "cuda" or "cpu" (auto-fallback to cpu if cuda unavailable)

data:
  root_dir: "datasets"
  train_dir: "datasets/train"
  val_dir: "datasets/validation"
  test_dir: "datasets/test"
  classes: ["NORMAL", "PNEUMONIA"]   # index 0 = NORMAL, index 1 = PNEUMONIA
  image_size: 300          # EfficientNet-B3 native resolution
  num_workers: 4
  pin_memory: true

augmentation:
  horizontal_flip_prob: 0.5
  rotation_limit_degrees: 15
  brightness_contrast_prob: 0.4
  brightness_limit: 0.2
  contrast_limit: 0.2
  random_crop_prob: 0.3
  crop_scale_min: 0.8
  crop_scale_max: 1.0
  normalize_mean: [0.485, 0.456, 0.406]   # ImageNet stats (matches pretrained backbone)
  normalize_std: [0.229, 0.224, 0.225]

model:
  architecture: "efficientnet_b3"
  pretrained: true
  num_classes: 2
  dropout: 0.3
  freeze_backbone_epochs: 3     # epochs to train only the classifier head before unfreezing

training:
  batch_size: 16
  epochs: 40
  lr: 0.0003
  fine_tune_lr: 0.00003          # lower LR used once backbone is unfrozen
  weight_decay: 0.00001
  optimizer: "adamw"
  label_smoothing: 0.05
  mixed_precision: true
  early_stopping_patience: 12
  early_stopping_min_delta: 0.001
  lr_scheduler: "reduce_on_plateau"   # "reduce_on_plateau" | "cosine" | "step"
  lr_scheduler_patience: 3
  lr_scheduler_factor: 0.5
  grad_clip_norm: 1.0
  checkpoint_dir: "checkpoints"
  resume_from: ""                # path to a .pt checkpoint to resume from, empty = start fresh
  save_best_only: false          # if true, only the best model is kept (best + last are always kept regardless)

logging:
  log_dir: "logs"
  tensorboard: true
  log_every_n_steps: 10

evaluation:
  outputs_dir: "outputs"
  threshold: 0.5                 # decision threshold on the positive (PNEUMONIA) class probability

gradcam:
  target_layer: "backbone.features.8"   # last conv block of EfficientNet-B3 in torchvision
  overlay_alpha: 0.45                    # heatmap transparency for overlay
  colormap: "COLORMAP_JET"
  outputs_dir: "outputs/gradcam"
