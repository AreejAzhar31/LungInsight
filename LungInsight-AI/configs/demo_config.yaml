augmentation:
  brightness_contrast_prob: 0.4
  brightness_limit: 0.2
  contrast_limit: 0.2
  crop_scale_max: 1.0
  crop_scale_min: 0.8
  horizontal_flip_prob: 0.5
  normalize_mean:
  - 0.485
  - 0.456
  - 0.406
  normalize_std:
  - 0.229
  - 0.224
  - 0.225
  random_crop_prob: 0.3
  rotation_limit_degrees: 15
data:
  classes:
  - NORMAL
  - PNEUMONIA
  image_size: 150
  num_workers: 2
  pin_memory: true
  root_dir: datasets
  test_dir: datasets/test
  train_dir: datasets/train
  val_dir: datasets/validation
evaluation:
  outputs_dir: outputs
  threshold: 0.5
gradcam:
  colormap: COLORMAP_JET
  outputs_dir: outputs/gradcam
  overlay_alpha: 0.45
  target_layer: backbone.features.8
logging:
  log_dir: logs
  log_every_n_steps: 10
  tensorboard: true
model:
  architecture: efficientnet_b3
  dropout: 0.3
  freeze_backbone_epochs: 2
  num_classes: 2
  pretrained: false
project:
  device: cpu
  name: LungInsight-AI
  seed: 42
training:
  batch_size: 8
  checkpoint_dir: checkpoints
  early_stopping_min_delta: 0.001
  early_stopping_patience: 8
  epochs: 8
  fine_tune_lr: 3.0e-05
  grad_clip_norm: 1.0
  label_smoothing: 0.05
  lr: 0.0003
  lr_scheduler: reduce_on_plateau
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 3
  mixed_precision: false
  optimizer: adamw
  resume_from: ''
  save_best_only: false
  weight_decay: 1.0e-05
